name: release

on:
  workflow_run:
    workflows: ["verifications"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    name: release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    env:
      DISTRIBUTION_REPOSITORIES: apt,homebrew-tap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: build/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: distribute
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.DISTRIBUTION_REPOSITORIES }}
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shipped=$(basename build/dist/brew/gettoken-*.tar.gz .tar.gz)
          version=${shipped#gettoken-}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" \
            --notes "Built from $GITHUB_SHA by run $GITHUB_RUN_ID." \
            build/dist/deb/*.deb build/dist/brew/*.tar.gz build/dist/brew/*.rb
      - name: tell the distribution repositories there is a release
        env:
          GH_TOKEN: ${{ steps.distribute.outputs.token }}
        run: |
          for repo in ${DISTRIBUTION_REPOSITORIES//,/ }; do
            gh api "repos/$GITHUB_REPOSITORY_OWNER/$repo/dispatches" \
              -f event_type=release -f "client_payload[repository]=$GITHUB_REPOSITORY"
          done

  integration:
    name: ${{ matrix.name }}
    needs: release
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Debian published, os: ubuntu-latest, container: 'debian:testing-slim', platform: DEBIAN }
          - { name: macOS published,  os: macos-latest,  container: '',                    platform: DARWIN }
    steps:
      - uses: actions/checkout@v4
      - run: |
          source constants.env
          add_archive="${{ matrix.platform }}_ADD_PUBLISHED_ARCHIVE"
          bash -ec "${!add_archive}"
      - run: |
          source constants.env
          wait_for_package="${{ matrix.platform }}_WAIT_FOR_PACKAGE"
          VERSION="${{ needs.release.outputs.version }}" bash -ec "${!wait_for_package}"
      - run: |
          mkdir -p build
          source constants.env
          install_command="${{ matrix.platform }}_INSTALL_COMMAND"
          remove_packages="${{ matrix.platform }}_REMOVE_PACKAGES"
          as_agent="${{ matrix.platform }}_AS_AGENT"
          BREW_TAP="$BREW_TAP" INSTALL_COMMAND="${!install_command}" REMOVE_PACKAGES="${!remove_packages}" AS_AGENT="${!as_agent}" bash src/integration-test/test.sh > build/integration-test-report.txt
      - if: always()
        uses: ./.github/actions/upload-reports
        with:
          name: reports-integration-${{ matrix.platform }}
